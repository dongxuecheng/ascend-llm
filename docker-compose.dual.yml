version: "2.4"

services:
  qwen36-b:
    image: "${VLLM_IMAGE}"
    container_name: qwen36-b
    restart: unless-stopped
    network_mode: host
    shm_size: 10g
    cpuset: "${CPUSET_B:-32-63}"
    stop_grace_period: 2m
    devices:
      - /dev/davinci2:/dev/davinci2
      - /dev/davinci3:/dev/davinci3
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    volumes:
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/sbin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - ${MODEL_DIR}:/models/Qwen3.6-35B-A3B-w8a8:ro
      - ${LOG_ROOT}/qwen36-b:/logs
      - ${CACHE_ROOT}/qwen36-b:/root/.cache
    environment:
      ASCEND_RT_VISIBLE_DEVICES: "2,3"
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
    command:
      - vllm
      - serve
      - /models/Qwen3.6-35B-A3B-w8a8
      - --host
      - 127.0.0.1
      - --port
      - "8081"
      - --tensor-parallel-size
      - "2"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-8}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-4096}"
      - --served-model-name
      - "${MODEL_NAME:-qwen3.6}"
      - --dtype
      - float16
      - --quantization
      - ascend
      - --max-model-len
      - "${MAX_MODEL_LEN:-20480}"
      - --no-enable-prefix-caching
      - --additional-config
      - '{"ascend_compilation_config":{"enable_npugraph_ex":false},"enable_cpu_binding":true}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,8]}'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8081/health", timeout=5)
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

  gateway:
    image: "${NGINX_IMAGE:-nginx:1.28-alpine}"
    container_name: qwen36-gateway
    restart: unless-stopped
    network_mode: host
    depends_on:
      qwen36-a:
        condition: service_healthy
      qwen36-b:
        condition: service_healthy
    environment:
      GATEWAY_LISTEN: "${GATEWAY_LISTEN:-127.0.0.1:8000}"
      NGINX_ENVSUBST_FILTER: GATEWAY_LISTEN
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
