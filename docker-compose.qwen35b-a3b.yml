version: "2.4"

services:
  qwen35b-a3b:
    image: "${VLLM_IMAGE:-quay.io/ascend/vllm-ascend:v0.23.0-310p-openeuler}"
    container_name: qwen36-35b-a3b
    restart: unless-stopped
    network_mode: host
    shm_size: 10g
    cpuset: "0-31"
    stop_grace_period: 2m
    devices:
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci1:/dev/davinci1
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    volumes:
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/sbin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - ${QWEN35_MODEL_DIR:-/data/models/Qwen3.6-35B-A3B-w8a8}:/models/qwen:ro
      - qwen35-cache:/root/.cache
    environment:
      ASCEND_RT_VISIBLE_DEVICES: "0,1"
      PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
      OMP_NUM_THREADS: "1"
      TASK_QUEUE_ENABLE: "1"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "3000"
    command:
      - vllm
      - serve
      - /models/qwen
      - --host
      - 127.0.0.1
      - --port
      - "8080"
      - --tensor-parallel-size
      - "2"
      - --gpu-memory-utilization
      - "${GPU_MEMORY_UTILIZATION:-0.90}"
      - --max-num-seqs
      - "${MAX_NUM_SEQS:-16}"
      - --max-num-batched-tokens
      - "${MAX_NUM_BATCHED_TOKENS:-4096}"
      - --served-model-name
      - "${QWEN35_MODEL_NAME:-qwen3.6-35b-a3b}"
      - --dtype
      - float16
      - --quantization
      - ascend
      - --max-model-len
      - "${QWEN35_MAX_MODEL_LEN:-20480}"
      - --no-enable-prefix-caching
      - --additional-config
      - '{"ascend_compilation_config":{"enable_npugraph_ex":false},"enable_cpu_binding":true}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[1,8]}'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=5)
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 10m
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"

volumes:
  qwen35-cache:
